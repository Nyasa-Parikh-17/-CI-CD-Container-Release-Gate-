name: TDS GA7 Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: "TDS identity: 24f2000714@ds.study.iitm.ac.in"
        run: echo "24f2000714@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test release-gate policy engine
        run: node test/policy.test.js

      - name: Smoke test the policy endpoint locally
        run: node test/smoke.js
